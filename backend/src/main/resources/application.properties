spring.application.name=MEDICARE

# ---------- Database (MySQL) ----------
# A NEW database name is used so this version never collides with your old data.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medicare_lite_v2}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Vanessa2014#}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
# Set JWT_SECRET in your environment for anything beyond local testing.
app.jwt.secret=${JWT_SECRET:changeThisToALongRandomSecretKeyForJwtSigning123456}
app.jwt.expirationMs=86400000

server.port=${PORT:8080}
# In production set APP_CORS_ALLOWED_ORIGINS to your frontend URL (comma-separated if more than one).
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# ---------- Time ----------
app.timezone=Africa/Lagos
# Pending appointments flip to COMPLETED once their time has passed (+ this many minutes).
app.appointments.auto-complete-grace-minutes=0

# ---------- Email (Brevo) ----------
# Create a free account at https://www.brevo.com, generate an API key (SMTP & API > API Keys)
# and verify a sender address (Senders & IP). Then set the two values below, or the
# BREVO_API_KEY / BREVO_SENDER_EMAIL environment variables.
# If no key is set, the 6-digit code is printed in the backend console instead (dev mode).
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.sender-email=${BREVO_SENDER_EMAIL:}
app.mail.sender-name=MediCare Lite
app.verification.code-ttl-minutes=10
app.verification.resend-cooldown-seconds=60
app.verification.max-attempts=5

# ---------- Hospital details (printed on receipts) ----------
app.hospital.name=MediCare Lite Hospital
app.hospital.address=12 Health Avenue, Ikeja, Lagos
app.hospital.phone=+234 800 000 0000

# ---------- First-run admin ----------
# Created automatically if no admin exists. CHANGE THE PASSWORD after first login.
app.seed.admin-name=System Admin
app.seed.admin-email=admin@medicare.local
app.seed.admin-password=Admin@12345
app.seed.demo-data=true
